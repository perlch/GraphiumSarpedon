    <div id="server-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3 style="font-weight: 500; font-size: 16px; color: var(--accent);">Server Connection</h3>
            <input type="text" id="server-url" value="http://localhost:8080" placeholder="Server URL">
            <button id="connect-btn" class="btn" style="background: var(--accent); color: #000; border:none; width: 100%; font-weight: bold;">Connect</button>
            <button id="close-modal-btn" class="btn" style="width: 100%;">Cancel</button>
        </div>
    </div>

    <input type="file" id="file-input" accept=".svg,image/*" class="hidden">

    <script>
        let state = {
            tool: 'brush',
            currentColor: '#00d2ff',
            strokeWidth: 3,
            markerWidth: 18,
            shapeToDraw: null,
            currentShapeUnitPts: null,
            fontSize: 24,
            panX: 0,
            panY: 0,
            zoom: 1,
            isDrawing: false,
            isPanning: false,
            isTransforming: false,
            isErasing: false,
            transformMode: null,
            startX: 0,
            startY: 0,
            lastMouseX: 0,
            lastMouseY: 0,
            history: [],
            historyStep: -1,
            selectedEl: null,
            serverUrl: null,
            currentFilePath: null,
            selectedNodePath: null,
            lassoPoints: [],
            lassoPolygon: null,
            clipboardSvg: null,
            activeColorSlot: null,
            editingTextNode: null,
            textEditorPos: { x: 50, y: 50 }
        };

        const canvas = document.getElementById('canvas');
        const container = document.getElementById('canvas-container');
        const viewport = document.getElementById('viewport');
        const svgLayer = document.getElementById('svg-layer');
        const uiOverlay = document.getElementById('ui-overlay');
        const uiLayerBlock = document.getElementById('ui-layer');

        const sidebarPanel = document.getElementById('sidebar-panel');
        const toggleExplorerBtn = document.getElementById('toggle-explorer');
        const hideSidebarBtn = document.getElementById('fm-hide-sidebar');
        const extendedToolbar = document.getElementById('extended-toolbar');
        const toggleExtendedBtn = document.getElementById('toggle-extended-toolbar');

        const textPalette = document.getElementById('text-editor-palette');
        const textPaletteTextarea = document.getElementById('text-palette-textarea');
        const textPaletteColor = document.getElementById('text-palette-color');

        let currentDrawElement = null;
        toggleExplorerBtn.addEventListener('click', () => {
            toggleExplorerBtn.classList.toggle('active');
            sidebarPanel.classList.toggle('collapsed');
        });

        hideSidebarBtn.addEventListener('click', () => {
            sidebarPanel.classList.add('collapsed');
            toggleExplorerBtn.classList.remove('active');
        });

        toggleExtendedBtn.addEventListener('click', () => {
            toggleExtendedBtn.classList.toggle('active');
            extendedToolbar.classList.toggle('visible');
        });

        document.querySelectorAll('#text-palette-latex-keys .pm-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const snippet = btn.getAttribute('data-insert');
                const start = textPaletteTextarea.selectionStart;
                const end = textPaletteTextarea.selectionEnd;
                const text = textPaletteTextarea.value;
                textPaletteTextarea.value = text.substring(0, start) + snippet + text.substring(end);
                textPaletteTextarea.focus();
                textPaletteTextarea.selectionEnd = start + snippet.length;
            });
        });

        function saveHistory() {
            if (state.historyStep < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyStep + 1);
            }
            state.history.push(svgLayer.innerHTML);
            state.historyStep++;
            autoSave();
        }

        function undo() {
            if (state.historyStep > 0) {
                state.historyStep--;
                svgLayer.innerHTML = state.history[state.historyStep];
                clearSelection();
                autoSave();
            }
        }

        function redo() {
            if (state.historyStep < state.history.length - 1) {
                state.historyStep++;
                svgLayer.innerHTML = state.history[state.historyStep];
                clearSelection();
                autoSave();
            }
        }

        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-redo').addEventListener('click', redo);

        window.addEventListener('keydown', e => {
            let tag = e.target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
            
            if (e.ctrlKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
            }
            if (e.ctrlKey && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
            }
        });

        function init() {
            updateTransform();
            saveHistory();
        }

        function updateTransform() {
          
            viewport.setAttribute('transform', `matrix(${state.zoom}, 0, 0, ${state.zoom}, ${state.panX}, ${state.panY})`);
            document.querySelectorAll('.transform-handle').forEach(el => {
                el.setAttribute('r', 6 / state.zoom);
            });
        }

        container.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
            const newZoom = Math.min(Math.max(0.02, state.zoom * zoomFactor), 200);

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            state.panX = mouseX - (mouseX - state.panX) * (newZoom / state.zoom);
            state.panY = mouseY - (mouseY - state.panY) * (newZoom / state.zoom);
            state.zoom = newZoom;

            updateTransform();
        }, { passive: false });

        let initialPinchDistance = null;
        let initialPinchZoom = 1;
        let initialPinchPanX = 0;
        let initialPinchPanY = 0;
        let pinchCenter = {x:0, y:0};

        container.addEventListener('touchstart', e => {
            if (e.touches.length === 2 && state.tool !== 'brush') { // avoid disrupting drawing actually
                e.preventDefault();
                state.isPanning = false; 
                
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDistance = Math.hypot(dx, dy);
                initialPinchZoom = state.zoom;
                
                const rect = canvas.getBoundingClientRect();
                pinchCenter = {
                    x: ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left,
                    y: ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top
                };
                
                initialPinchPanX = state.panX;
                initialPinchPanY = state.panY;
            }
        }, { passive: false });

        container.addEventListener('touchmove', e => {
            if (e.touches.length === 2 && initialPinchDistance !== null) {
                e.preventDefault();
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                let currentDistance = Math.hypot(dx, dy);
                
                let zoomFactor = currentDistance / initialPinchDistance;
                let newZoom = Math.min(Math.max(0.02, initialPinchZoom * zoomFactor), 200);
                
                state.panX = pinchCenter.x - (pinchCenter.x - initialPinchPanX) * (newZoom / initialPinchZoom);
                state.panY = pinchCenter.y - (pinchCenter.y - initialPinchPanY) * (newZoom / initialPinchZoom);
                state.zoom = newZoom;
                
                updateTransform();
            }
        }, { passive: false });

        container.addEventListener('touchend', e => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });

        document.getElementById('center-btn').addEventListener('click', () => {
            state.panX = 0;
            state.panY = 0;
            state.zoom = 1;
            updateTransform();
        });

        function getSvgCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
            
            return {
                x: (clientX - rect.left - state.panX) / state.zoom,
                y: (clientY - rect.top - state.panY) / state.zoom
            };
        }

        let textPaletteDrag = { active: false, startX: 0, startY: 0, initialLeft: 0, initialTop: 0 };
        
        document.getElementById('text-palette-header').addEventListener('mousedown', e => {
            textPaletteDrag.active = true;
            textPaletteDrag.startX = e.clientX;
            textPaletteDrag.startY = e.clientY;
            textPaletteDrag.initialLeft = parseInt(textPalette.style.left || 50);
            textPaletteDrag.initialTop = parseInt(textPalette.style.top || 50);
        });

        document.addEventListener('mousemove', e => {
            if (textPaletteDrag.active) {
                let dx = e.clientX - textPaletteDrag.startX;
                let dy = e.clientY - textPaletteDrag.startY;
                textPalette.style.left = (textPaletteDrag.initialLeft + dx) + 'px';
                textPalette.style.top = (textPaletteDrag.initialTop + dy) + 'px';
            }
        });

        document.addEventListener('mouseup', () => { textPaletteDrag.active = false; });

        document.getElementById('text-palette-close').addEventListener('click', () => {
            textPalette.style.display = 'none';
        });

        document.getElementById('text-palette-smaller').addEventListener('click', () => {
            state.fontSize = Math.max(8, state.fontSize - 4);
            if (state.editingTextNode) state.editingTextNode.style.fontSize = state.fontSize + 'px';
        });
        
        document.getElementById('text-palette-larger').addEventListener('click', () => {
            state.fontSize += 4;
            if (state.editingTextNode) state.editingTextNode.style.fontSize = state.fontSize + 'px';
        });

        document.getElementById('text-palette-color').addEventListener('input', e => {
            let col = e.target.value;
            state.currentColor = col;
            if (state.editingTextNode) {
                if (state.editingTextNode.tagName.toLowerCase() === 'text') {
                    state.editingTextNode.setAttribute('fill', col);
                } else {
                    state.editingTextNode.style.color = col;
                }
            }
        });

        document.getElementById('text-palette-paste-lasso').addEventListener('click', () => {
            if (!state.clipboardSvg) return alert("Буфер лассо пуст! Сначала скопируйте область.");
            
            let svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" width="${state.clipboardSvg.width}" height="${state.clipboardSvg.height}" viewBox="${state.clipboardSvg.minX} ${state.clipboardSvg.minY} ${state.clipboardSvg.width} ${state.clipboardSvg.height}" style="display:inline-block; vertical-align:middle; margin: 4px;">${state.clipboardSvg.content}</svg>`;
            
            const start = textPaletteTextarea.selectionStart;
            const text = textPaletteTextarea.value;
            textPaletteTextarea.value = text.substring(0, start) + svgMarkup + text.substring(textPaletteTextarea.selectionEnd);
        });

        function openTextPaletteForElement(el, initialText = "", isNew = false) {
            state.editingTextNode = el;
            textPalette.style.display = 'flex';
            textPaletteTextarea.value = initialText;

            let rect = canvas.getBoundingClientRect();
            textPalette.style.left = Math.min(rect.left + 50, window.innerWidth - 450) + 'px';
            textPalette.style.top = Math.min(rect.top + 50, window.innerHeight - 300) + 'px';

            document.getElementById('text-palette-apply').onclick = () => {
                let txt = textPaletteTextarea.value;
                if (!txt.trim()) {
                    if (el.parentNode) el.parentNode.removeChild(el);
                    textPalette.style.display = 'none';
                    return;
                }

                if (txt.includes('<svg') || txt.includes('$$') || txt.includes('$')) {
                    
                    let fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
                   
                    fo.setAttribute('x', el.getAttribute('x') || state.textEditorPos.x);
                    fo.setAttribute('y', el.getAttribute('y') || state.textEditorPos.y);
                    fo.setAttribute('width', '800'); 
                    fo.setAttribute('height', '600');

                    let div = document.createElement('div');
                    div.style.color = state.currentColor;
                    div.style.fontSize = state.fontSize + 'px';
                    div.innerHTML = txt;
                    fo.appendChild(div);

                    if (window.renderMathInElement) {
                        renderMathInElement(div, {
                            delimiters: [
                                {left: "$$", right: "$$", display: true},
                                {left: "$", right: "$", display: false}
                            ],
                            throwOnError: false
                        });
                    }

                    if (el.tagName.toLowerCase() === 'text') {
                        svgLayer.insertBefore(fo, el);
                        svgLayer.removeChild(el);
                    } else if (isNew) {
                        svgLayer.appendChild(fo);
                    }
                } else {
                    el.setAttribute('fill', state.currentColor);
                    el.setAttribute('font-size', state.fontSize);
                    el.setAttribute('font-family', 'sans-serif');
                    el.textContent = txt;
                    if (isNew) svgLayer.appendChild(el);
                }
                saveHistory();
                textPalette.style.display = 'none';
            };
        }

        function eraseElementAtPoint(clientX, clientY) {
            const el = document.elementFromPoint(clientX, clientY);
            if (el && el !== canvas && el !== container && !el.classList.contains('lasso-polygon')) {
                let target = el;
                while (target && target.parentNode !== svgLayer && target !== canvas) {
                    target = target.parentNode;
                }
                if (target && target.parentNode === svgLayer) {
                    target.remove();
                    return true;
                }
            }
            return false;
        }

        window.addEventListener('pointerdown', e => {
            if (e.target.closest('#ui-layer') || e.target.closest('#activity-bar') || e.target.closest('#sidebar-panel') || e.target.closest('#text-editor-palette')) return;
            
            let lassoBar = document.getElementById('lasso-action-bar');
            if (lassoBar && !e.target.closest('#lasso-action-bar')) {
                lassoBar.remove();
            }

            if (e.button === 1 || state.tool === 'pan') {
                state.isPanning = true;
                state.lastMouseX = e.clientX;
                state.lastMouseY = e.clientY;
                container.style.cursor = 'grabbing';
                return;
            }

            if (e.button !== 0) return;

            const coords = getSvgCoords(e);
            state.startX = coords.x;
            state.startY = coords.y;

            if (state.tool === 'eraser') {
                state.isErasing = true;
                if (eraseElementAtPoint(e.clientX, e.clientY)) {
                    saveHistory();
                }
                return;
            }

            if (state.tool === 'fill') {
                let el = document.elementFromPoint(e.clientX, e.clientY);
                if (el && el !== canvas) {
                    let target = el;
                    while (target && target.parentNode !== svgLayer && target !== canvas) {
                        target = target.parentNode;
                    }
                    if (target && target.parentNode === svgLayer) {
                        if (target.tagName.toLowerCase() === 'path' && target.getAttribute('fill') === 'none') {
                            target.setAttribute('stroke', state.currentColor);
                        } else {
                            target.setAttribute('fill', state.currentColor);
                        }
                        saveHistory();
                    }
                }
                return;
            }

            if (state.tool === 'picker') {
                let el = document.elementFromPoint(e.clientX, e.clientY);
                if (el && el !== canvas) {
                    let stroke = el.getAttribute('stroke');
                    let fill = el.getAttribute('fill');
                    let pickedColor = (stroke && stroke !== 'none') ? stroke : (fill && fill !== 'none' ? fill : state.currentColor);
        
                    let targetSlot = state.activeColorSlot || document.getElementById('slot-1');
                    if (targetSlot.id === 'slot-3') {
                        document.getElementById('color-picker-input').value = pickedColor;
                    } else {
                        targetSlot.style.backgroundColor = pickedColor;
                        targetSlot.style.color = pickedColor;
                    }
                    selectColorSlot(targetSlot, pickedColor);
                    setTool('brush');
                }
                return;
            }

            if (state.tool === 'select') {
                if (e.target.classList.contains('transform-handle')) {
                    state.isTransforming = true;
                    state.transformMode = 'scale-rotate';
                    return;
                }

                let target = e.target;
                while (target && target.parentNode !== svgLayer && target !== canvas) {
                    target = target.parentNode;
                }

                if (target && target.parentNode === svgLayer) {
                    selectElement(target);
                    state.isTransforming = true;
                    state.transformMode = 'move';
                    state.lastMouseX = coords.x;
                    state.lastMouseY = coords.y;
                } else {
                    clearSelection();
                }
                return;
            }
            
            if (state.tool === 'lasso') {
                state.isDrawing = true;
                state.lassoPoints = [{x: coords.x, y: coords.y}];
                state.lassoPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                state.lassoPolygon.setAttribute('class', 'lasso-polygon');
                let pStr = `${coords.x},${coords.y}`;
                state.lassoPolygon.setAttribute('points', pStr);
                uiOverlay.appendChild(state.lassoPolygon);
                return;
            }

            if (state.tool === 'text') {
                let textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textEl.setAttribute('x', coords.x);
                textEl.setAttribute('y', coords.y);
                state.textEditorPos = { x: coords.x, y: coords.y };
                openTextPaletteForElement(textEl, "", true);
                return;
            }

            if (state.tool === 'shape') {
                state.isDrawing = true;
                state.startX = coords.x;
                state.startY = coords.y;
                if (SHAPE_UNIT_TEMPLATES[state.shapeToDraw]) {
                    state.currentShapeUnitPts = SHAPE_UNIT_TEMPLATES[state.shapeToDraw]();
                } else {
                    state.currentShapeUnitPts = null;
                }
                currentDrawElement = createShapeElement(state.shapeToDraw);
                currentDrawElement.setAttribute('stroke', state.shapeColor);
                currentDrawElement.setAttribute('stroke-width', 2.5);
                currentDrawElement.setAttribute('fill', state.shapeColor);
                currentDrawElement.setAttribute('fill-opacity', '0.12');
                currentDrawElement.setAttribute('stroke-linejoin', 'round');
                updateShapeGeometry(currentDrawElement, state.shapeToDraw, 0.5, 0.5, coords.x, coords.y);
                svgLayer.appendChild(currentDrawElement);
                return;
            }

            state.isDrawing = true;
            if (state.tool === 'brush') {
                currentDrawElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                currentDrawElement.setAttribute('d', `M ${coords.x} ${coords.y}`);
                currentDrawElement.setAttribute('stroke', state.currentColor);
                currentDrawElement.setAttribute('fill', 'none');
                currentDrawElement.setAttribute('stroke-width', state.strokeWidth);
                currentDrawElement.setAttribute('stroke-linecap', 'round');
                currentDrawElement.setAttribute('stroke-linejoin', 'round');
                svgLayer.appendChild(currentDrawElement);
            } else if (state.tool === 'marker') {
                currentDrawElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                currentDrawElement.setAttribute('d', `M ${coords.x} ${coords.y}`);
                currentDrawElement.setAttribute('stroke', state.currentColor);
                currentDrawElement.setAttribute('fill', 'none');
                currentDrawElement.setAttribute('stroke-width', state.markerWidth);
                currentDrawElement.setAttribute('stroke-linecap', 'round');
                currentDrawElement.setAttribute('stroke-linejoin', 'round');
                currentDrawElement.setAttribute('opacity', '0.35');
                currentDrawElement.setAttribute('class', 'marker-stroke');
                svgLayer.appendChild(currentDrawElement);
            } else if (state.tool === 'line') {
                currentDrawElement = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                currentDrawElement.setAttribute('x1', coords.x);
                currentDrawElement.setAttribute('y1', coords.y);
                currentDrawElement.setAttribute('x2', coords.x);
                currentDrawElement.setAttribute('y2', coords.y);
                currentDrawElement.setAttribute('stroke', state.currentColor);
                currentDrawElement.setAttribute('stroke-width', state.strokeWidth);
                currentDrawElement.setAttribute('stroke-linecap', 'round');
                svgLayer.appendChild(currentDrawElement);
            }
        });

        window.addEventListener('pointermove', e => {
            if (state.isPanning) {
                let dx = e.clientX - state.lastMouseX;
                let dy = e.clientY - state.lastMouseY;
                state.panX += dx;
                state.panY += dy;
                state.lastMouseX = e.clientX;
                state.lastMouseY = e.clientY;
                updateTransform();
                return;
            }

            if (state.isErasing) {
                eraseElementAtPoint(e.clientX, e.clientY);
                return;
            }

            const coords = getSvgCoords(e);

            if (state.isDrawing && state.tool === 'lasso') {
                state.lassoPoints.push({x: coords.x, y: coords.y});
                let pointsStr = state.lassoPoints.map(p => `${p.x},${p.y}`).join(' ');
                state.lassoPolygon.setAttribute('points', pointsStr);
                return;
            }
            if (state.isTransforming && state.selectedEl) {
                if (state.transformMode === 'move') {
                    let dx = coords.x - state.lastMouseX;
                    let dy = coords.y - state.lastMouseY;
                    let xf = getXform(state.selectedEl);
                    xf.tx += dx;
                    xf.ty += dy;
                    applyXform(state.selectedEl, xf);

                    state.lastMouseX = coords.x;
                    state.lastMouseY = coords.y;
                    renderSelectionOverlay();
                } else if (state.transformMode === 'scale-rotate') {
                    let bbox = state.selectedEl.getBBox();
                    let cx = bbox.x + bbox.width / 2;
                    let cy = bbox.y + bbox.height / 2;

                    let dx = coords.x - cx;
                    let dy = coords.y - cy;

                    let rad = Math.atan2(dy, dx);
                    let deg = rad * (180 / Math.PI);
                    if (e.shiftKey) deg = Math.round(deg / 45) * 45;

                    let origDiag = Math.sqrt(Math.pow(bbox.width / 2, 2) + Math.pow(bbox.height / 2, 2));
                    let curDiag = Math.sqrt(dx * dx + dy * dy);
                    let scale = Math.max(0.05, curDiag / origDiag);

                    let xf = getXform(state.selectedEl);
                    xf.rot = deg;
                    xf.scale = scale;
                    applyXform(state.selectedEl, xf);
                    renderSelectionOverlay();
                }
                return;
            }

            if (!state.isDrawing || !currentDrawElement) return;

            let curX = coords.x;
            let curY = coords.y;

            if (e.shiftKey) {
                let angle = Math.atan2(curY - state.startY, curX - state.startX) * (180 / Math.PI);
                let absAngle = Math.abs(angle);
                if (absAngle < 8 || absAngle > 172) curY = state.startY;
                else if (Math.abs(absAngle - 90) < 8) curX = state.startX;
            }

            if (state.tool === 'brush' || state.tool === 'marker') {
                let d = currentDrawElement.getAttribute('d');
                if (e.shiftKey) {
                    currentDrawElement.setAttribute('d', `M ${state.startX} ${state.startY} L ${curX} ${curY}`);
                } else {
                    currentDrawElement.setAttribute('d', `${d} L ${curX} ${curY}`);
                }
            } else if (state.tool === 'line') {
                currentDrawElement.setAttribute('x2', curX);
                currentDrawElement.setAttribute('y2', curY);
            } else if (state.tool === 'shape') {
                let hw = Math.abs(curX - state.startX) / 2;
                let hh = Math.abs(curY - state.startY) / 2;
                if (e.shiftKey) hw = hh = Math.max(hw, hh);
                let cx = state.startX + (curX >= state.startX ? hw : -hw);
                let cy = state.startY + (curY >= state.startY ? hh : -hh);
                updateShapeGeometry(currentDrawElement, state.shapeToDraw, hw, hh, cx, cy);
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (state.isPanning) {
                state.isPanning = false;
                container.style.cursor = state.tool === 'pan' ? 'grab' : 'crosshair';
            }
            if (state.isErasing) {
                state.isErasing = false;
                saveHistory();
            }
            if (state.isTransforming) {
                state.isTransforming = false;
                saveHistory();
            }
            if (state.isDrawing && state.tool === 'lasso') {
                state.isDrawing = false;
                if (state.lassoPoints.length > 2) {
                    let minX = Math.min(...state.lassoPoints.map(p => p.x));
                    let maxX = Math.max(...state.lassoPoints.map(p => p.x));
                    let minY = Math.min(...state.lassoPoints.map(p => p.y));
                    let maxY = Math.max(...state.lassoPoints.map(p => p.y));

                    let group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    let elementsToMove = [];

                    Array.from(svgLayer.children).forEach(el => {
                        let bbox = el.getBBox();
                        if (bbox.width > 0 && bbox.height > 0) {
                            if (bbox.x >= minX && bbox.y >= minY && (bbox.x + bbox.width) <= maxX && (bbox.y + bbox.height) <= maxY) {
                                elementsToMove.push(el);
                            }
                        }
                    });

                    if (elementsToMove.length > 0) {
                        elementsToMove.forEach(el => group.appendChild(el));
                        svgLayer.appendChild(group);
                        setTool('select');
                        selectElement(group);

                        let existingBar = document.getElementById('lasso-action-bar');
                        if (existingBar) existingBar.remove();

                        let bar = document.createElement('div');
                        bar.id = 'lasso-action-bar';
                        bar.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
                        bar.style.top = Math.max(e.clientY - 50, 10) + 'px';
                        bar.innerHTML = `
                            <button class="btn" id="lasso-copy" title="Copy to Clipboard"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                            <button class="btn" id="lasso-color" title="Change Color"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.4 1.5-1.4H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/></svg></button>
                        `;
                        document.body.appendChild(bar);

                        document.getElementById('lasso-copy').onclick = () => {
                            state.clipboardSvg = {
                                content: group.innerHTML,
                                minX: minX,
                                minY: minY,
                                width: maxX - minX,
                                height: maxY - minY
                            };
                            bar.remove();
                            bar.innerHTML = `<span style="color: var(--accent); padding: 5px;">Copied!</span>`;
                            document.body.appendChild(bar);
                            setTimeout(() => bar.remove(), 1000);
                        };

                        document.getElementById('lasso-color').onclick = () => {
                            let newCol = state.currentColor; 
                            if (confirm(`Apply active color (${newCol})?`)) {
                                group.querySelectorAll('*').forEach(child => {
                                    if (child.getAttribute('stroke') && child.getAttribute('stroke') !== 'none') child.setAttribute('stroke', newCol);
                                    if (child.getAttribute('fill') && child.getAttribute('fill') !== 'none') child.setAttribute('fill', newCol);
                                });
                                saveHistory();
                            }
                        };
                    }
                }
                
                if (state.lassoPolygon) {
                    state.lassoPolygon.remove();
                    state.lassoPolygon = null;
                }
                saveHistory();
                return;
            }
            if (state.isDrawing && state.tool === 'shape') {
                state.isDrawing = false;
                if (currentDrawElement) {
                    let bbox = currentDrawElement.getBBox();
                    if (bbox.width < 8 || bbox.height < 8) {
                        updateShapeGeometry(currentDrawElement, state.shapeToDraw, 70, 70, state.startX, state.startY);
                    }
                    setTool('select');
                    selectElement(currentDrawElement);
                }
                currentDrawElement = null;
                state.currentShapeUnitPts = null;
                saveHistory();
                return;
            }
            if (state.isDrawing) {
                state.isDrawing = false;
                currentDrawElement = null;
                saveHistory();
            }
        });

        function getXform(el) {
            if (el.dataset.gxTx === undefined) {
                let t = el.getAttribute('transform') || '';
                let m = t.match(/translate\(([-0-9.e]+)[,\s]+([-0-9.e]+)\)/);
                el.dataset.gxTx = m ? m[1] : 0;
                el.dataset.gxTy = m ? m[2] : 0;
                el.dataset.gxRot = 0;
                el.dataset.gxScale = 1;
            }
            return {
                tx: parseFloat(el.dataset.gxTx),
                ty: parseFloat(el.dataset.gxTy),
                rot: parseFloat(el.dataset.gxRot),
                scale: parseFloat(el.dataset.gxScale)
            };
        }

        function applyXform(el, xf) {
            el.dataset.gxTx = xf.tx;
            el.dataset.gxTy = xf.ty;
            el.dataset.gxRot = xf.rot;
            el.dataset.gxScale = xf.scale;
            let bbox = el.getBBox();
            let cx = bbox.x + bbox.width / 2;
            let cy = bbox.y + bbox.height / 2;
            el.setAttribute('transform', `translate(${cx + xf.tx}, ${cy + xf.ty}) rotate(${xf.rot}) scale(${xf.scale}) translate(${-cx}, ${-cy})`);
        }

        function clearOverlayDOM() {
            Array.from(uiOverlay.children).forEach(child => {
                if (!child.classList.contains('lasso-polygon')) {
                    child.remove();
                }
            });
        }

        function selectElement(el) {
            state.selectedEl = el;
            renderSelectionOverlay();
        }

        function clearSelection() {
            state.selectedEl = null;
            clearOverlayDOM();
        }

        function renderSelectionOverlay() {
            clearOverlayDOM();
            if (!state.selectedEl) return;

            let bbox = state.selectedEl.getBBox();
            let transform = state.selectedEl.getAttribute('transform') || '';

            let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', transform);

            let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', bbox.x - 4);
            rect.setAttribute('y', bbox.y - 4);
            rect.setAttribute('width', bbox.width + 8);
            rect.setAttribute('height', bbox.height + 8);
            rect.setAttribute('class', 'selection-overlay');

            let handle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            handle.setAttribute('cx', bbox.x + bbox.width + 4);
            handle.setAttribute('cy', bbox.y + bbox.height + 4);
            handle.setAttribute('r', 6 / state.zoom);
            handle.setAttribute('class', 'transform-handle');

            g.appendChild(rect);
            g.appendChild(handle);
            uiOverlay.appendChild(g);
        }

        function setTool(toolName) {
            state.tool = toolName;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            let activeBtn = document.querySelector(`.tool-btn[data-tool="${toolName}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            if (toolName !== 'shape') {
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            }

            if (toolName === 'pan') container.style.cursor = 'grab';
            else if (toolName === 'select') container.style.cursor = 'default';
            else if (toolName === 'eraser') container.style.cursor = 'cell';
            else if (toolName === 'fill' || toolName === 'picker') container.style.cursor = 'copy';
            else if (toolName === 'lasso') container.style.cursor = 'crosshair';
            else {
                container.style.cursor = 'crosshair';
                clearSelection();
            }
        }

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                setTool(e.currentTarget.getAttribute('data-tool'));
            });
        });
        function selectColorSlot(slotEl, color) {
            document.querySelectorAll('.color-slot').forEach(s => s.classList.remove('active'));
            slotEl.classList.add('active');
            state.currentColor = color;
            state.activeColorSlot = slotEl;
            //here goes da sync
            textPaletteColor.value = color;
        }

        state.activeColorSlot = document.getElementById('slot-1');
        document.getElementById('slot-1').onclick = () => selectColorSlot(document.getElementById('slot-1'), '#00d2ff');
        document.getElementById('slot-2').onclick = () => selectColorSlot(document.getElementById('slot-2'), document.getElementById('slot-2').style.backgroundColor || '#ff0055');
        
        document.getElementById('color-picker-input').addEventListener('input', e => {
            let col = e.target.value;
            let slot2 = document.getElementById('slot-2');
            slot2.style.backgroundColor = col;
            slot2.style.color = col;
            selectColorSlot(slot2, col);
        });
        function getBoundingBoxWithPadding(padding = 20) {
            let bbox = svgLayer.getBBox();
            if (bbox.width === 0 || bbox.height === 0) {
                return { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };
            }
            return {
                x: bbox.x - padding,
                y: bbox.y - padding,
                width: bbox.width + padding * 2,
                height: bbox.height + padding * 2
            };
        }

        document.getElementById('export-svg').addEventListener('click', () => {
            const uiClone = uiOverlay.cloneNode(true);
            uiOverlay.innerHTML = '';
            
            const svgData = new XMLSerializer().serializeToString(canvas);
            const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'drawing.svg'; a.click(); URL.revokeObjectURL(url);
            
            uiOverlay.innerHTML = uiClone.innerHTML;
        });

        document.getElementById('export-png').addEventListener('click', () => {
            const uiClone = uiOverlay.cloneNode(true);
            uiOverlay.innerHTML = '';

            const bounds = getBoundingBoxWithPadding();
            
            const scaleFactor = window.devicePixelRatio || 3;
            
            const svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="${bounds.width}" height="${bounds.height}" viewBox="${bounds.x} ${bounds.y} ${bounds.width} ${bounds.height}">
                <rect x="${bounds.x}" y="${bounds.y}" width="${bounds.width}" height="${bounds.height}" fill="${getComputedStyle(document.body).backgroundColor}"/>
                ${svgLayer.innerHTML}
            </svg>`;
            
            const canvasImg = document.createElement('canvas');
            canvasImg.width = bounds.width * scaleFactor;
            canvasImg.height = bounds.height * scaleFactor;
            
            const ctx = canvasImg.getContext('2d');
            ctx.scale(scaleFactor, scaleFactor);
            
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, bounds.width, bounds.height);
                const a = document.createElement('a');
                a.download = 'drawing_HD.png';
                a.href = canvasImg.toDataURL('image/png', 1.0);
                a.click();
                
                uiOverlay.innerHTML = uiClone.innerHTML;
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', e => {
            let file = e.target.files[0];
            if (!file) return;

            if (file.type.includes('image')) {
                let reader = new FileReader();
                reader.onload = (evt) => insertImageFromDataUrl(evt.target.result);
                reader.readAsDataURL(file);
                e.target.value = '';
                return;
            }

            let reader = new FileReader();
            reader.onload = (f) => {
                let parser = new DOMParser();
                let doc = parser.parseFromString(f.target.result, "image/svg+xml");
                let importedLayer = doc.getElementById('svg-layer') || doc.documentElement;
                svgLayer.innerHTML = importedLayer.innerHTML;
                saveHistory();
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        function insertImageFromDataUrl(dataUrl) {
            let img = new Image();
            img.onload = () => {
                let svgImg = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                svgImg.setAttribute('href', dataUrl);
                const coords = getSvgCoords({clientX: window.innerWidth/2, clientY: window.innerHeight/2});
                svgImg.setAttribute('x', coords.x - (img.width/4)); 
                svgImg.setAttribute('y', coords.y - (img.height/4));
                svgImg.setAttribute('width', Math.min(img.width, 400));
                svgImg.setAttribute('height', (img.height / img.width) * Math.min(img.width, 400));
                svgLayer.appendChild(svgImg);
                setTool('select');
                selectElement(svgImg);
                saveHistory();
            };
            img.src = dataUrl;
        }

        window.addEventListener('paste', e => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    let reader = new FileReader();
                    reader.onload = (evt) => insertImageFromDataUrl(evt.target.result);
                    reader.readAsDataURL(blob);
                }
            }
        });

        function svgEl(tag, attrs) {
            let el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            for (let k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        function placeNewElement(el) {
            const coords = getSvgCoords({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
            el.setAttribute('transform', `translate(${coords.x}, ${coords.y})`);
            svgLayer.appendChild(el);
            setTool('select');
            selectElement(el);
            saveHistory();
        }

        function evalMathExpr(exprStr, scope) {
            scope = scope || {};
            let src = String(exprStr).replace(/\s+/g, '');
            if (!src) throw new Error('Empty expression');
            let i = 0;

            function peek() { return src[i]; }
            function fail(msg) { throw new Error(msg + ' (at ' + i + ')'); }

            function parseExpression() {
                let value = parseTerm();
                while (peek() === '+' || peek() === '-') {
                    let op = src[i++];
                    let rhs = parseTerm();
                    value = op === '+' ? value + rhs : value - rhs;
                }
                return value;
            }

            function parseTerm() {
                let value = parseUnary();
                while (peek() === '*' || peek() === '/') {
                    let op = src[i++];
                    let rhs = parseUnary();
                    value = op === '*' ? value * rhs : value / rhs;
                }
                return value;
            }

            function parseUnary() {
                if (peek() === '-') { i++; return -parseUnary(); }
                if (peek() === '+') { i++; return parseUnary(); }
                return parsePower();
            }

            function parsePower() {
                let base = parseAtom();
                if (peek() === '^') {
                    i++;
                    let exp = parseUnary();
                    return Math.pow(base, exp);
                }
                return base;
            }

            function parseAtom() {
                if (peek() === '(') {
                    i++;
                    let v = parseExpression();
                    if (peek() !== ')') fail('Expected )');
                    i++;
                    return v;
                }
                let numMatch = /^[0-9]*\.?[0-9]+/.exec(src.slice(i));
                if (numMatch) {
                    i += numMatch[0].length;
                    return parseFloat(numMatch[0]);
                }
                let idMatch = /^[a-zA-Z_][a-zA-Z0-9_]*/.exec(src.slice(i));
                if (idMatch) {
                    let name = idMatch[0];
                    i += name.length;
                    if (peek() === '(') {
                        i++;
                        let arg = parseExpression();
                        if (peek() === ',') {
                            i++;
                            let arg2 = parseExpression();
                            if (peek() !== ')') fail('Expected )');
                            i++;
                            return applyFn2(name, arg, arg2);
                        }
                        if (peek() !== ')') fail('Expected )');
                        i++;
                        return applyFn(name, arg);
                    }
                    return resolveIdent(name, scope);
                }
                fail('Unexpected token');
            }

            function applyFn(name, x) {
                switch (name) {
                    case 'sqrt': return Math.sqrt(x);
                    case 'sin': return Math.sin(x);
                    case 'cos': return Math.cos(x);
                    case 'tan': return Math.tan(x);
                    case 'asin': return Math.asin(x);
                    case 'acos': return Math.acos(x);
                    case 'atan': return Math.atan(x);
                    case 'log': return Math.log(x) / Math.LN10;
                    case 'ln': return Math.log(x);
                    case 'abs': return Math.abs(x);
                    case 'exp': return Math.exp(x);
                    case 'floor': return Math.floor(x);
                    case 'ceil': return Math.ceil(x);
                    case 'round': return Math.round(x);
                    default: fail('Unknown function: ' + name);
                }
            }

            function applyFn2(name, a, b) {
                if (name === 'log') return Math.log(b) / Math.log(a);
                fail('Unknown function: ' + name);
            }

            function resolveIdent(name, scope) {
                if (name === 'pi') return Math.PI;
                if (name === 'e') return Math.E;
                if (name in scope) return scope[name];
                fail('Unknown identifier: ' + name);
            }

            let result = parseExpression();
            if (i < src.length) fail('Unexpected trailing input');
            return result;
        }

        document.getElementById('stroke-width-slider').addEventListener('input', e => {
            state.strokeWidth = parseFloat(e.target.value);
        });
        document.getElementById('marker-width-slider').addEventListener('input', e => {
            state.markerWidth = parseFloat(e.target.value);
        });

        state.shapeColor = '#00d2ff';
        document.getElementById('shape-color-input').addEventListener('input', e => {
            state.shapeColor = e.target.value;
            let slot = document.getElementById('shape-color-slot');
            slot.style.background = state.shapeColor;
            slot.style.color = state.shapeColor;
        });

        function randomTriangleUnitPoints() {
            for (let attempt = 0; attempt < 20; attempt++) {
                let pts = [0, 1, 2].map(() => {
                    let ang = Math.random() * Math.PI * 2;
                    let rad = 0.5 + Math.random() * 0.5;
                    return [Math.cos(ang) * rad, Math.sin(ang) * rad];
                });
                let area = Math.abs((pts[1][0] - pts[0][0]) * (pts[2][1] - pts[0][1]) - (pts[2][0] - pts[0][0]) * (pts[1][1] - pts[0][1])) / 2;
                if (area > 0.15) return pts;
            }
            return [[0, -1], [1, 1], [-1, 1]];
        }

        function randomTrapezoidUnitPoints() {
            let topW = 0.3 + Math.random() * 0.5;
            let skew = (Math.random() - 0.5) * 0.6;
            return [[skew - topW, -1], [skew + topW, -1], [1, 1], [-1, 1]];
        }

        const SHAPE_UNIT_TEMPLATES = {
            parallelogram: () => [[-0.65, -1], [1.35, -1], [0.65, 1], [-1.35, 1]],
            'triangle-isosceles': () => [[0, -1], [1, 1], [-1, 1]],
            'triangle-equilateral': () => [[0, -1], [1, 0.5], [-1, 0.5]],
            'triangle-right': () => [[-1, -1], [-1, 1], [1, 1]],
            'triangle-random': () => randomTriangleUnitPoints(),
            'trapezoid-isosceles': () => [[-0.5, -1], [0.5, -1], [1, 1], [-1, 1]],
            'trapezoid-right': () => [[-1, -1], [0, -1], [1, 1], [-1, 1]],
            'trapezoid-random': () => randomTrapezoidUnitPoints(),
            diamond: () => [[0, -1], [1, 0], [0, 1], [-1, 0]]
        };

        function createShapeElement(shapeName) {
            if (shapeName === 'circle') return document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
            if (shapeName === 'square') return document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            return document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        }

        function updateShapeGeometry(el, shapeName, hw, hh, cx, cy) {
            hw = Math.max(hw, 0.5);
            hh = Math.max(hh, 0.5);
            if (shapeName === 'circle') {
                el.setAttribute('cx', cx);
                el.setAttribute('cy', cy);
                el.setAttribute('rx', hw);
                el.setAttribute('ry', hh);
            } else if (shapeName === 'square') {
                el.setAttribute('x', cx - hw);
                el.setAttribute('y', cy - hh);
                el.setAttribute('width', hw * 2);
                el.setAttribute('height', hh * 2);
            } else {
                let unitPts = state.currentShapeUnitPts || (SHAPE_UNIT_TEMPLATES[shapeName] ? SHAPE_UNIT_TEMPLATES[shapeName]() : [[0, -1], [1, 1], [-1, 1]]);
                let pts = unitPts.map(([ux, uy]) => (ux * hw + cx).toFixed(2) + ',' + (uy * hh + cy).toFixed(2)).join(' ');
                el.setAttribute('points', pts);
            }
        }

        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                state.shapeToDraw = btn.getAttribute('data-shape');
                setTool('shape');
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        const calcPopup = document.getElementById('calculator-popup');
        const calcInput = document.getElementById('calc-input');
        const calcResult = document.getElementById('calc-result');

        document.getElementById('calc-toggle-btn').addEventListener('click', () => {
            document.getElementById('graph-popup').classList.remove('open');
            calcPopup.classList.toggle('open');
            if (calcPopup.classList.contains('open')) calcInput.focus();
        });

        calcInput.addEventListener('input', () => {
            if (!calcInput.value.trim()) { calcResult.textContent = '0'; return; }
            try {
                let val = evalMathExpr(calcInput.value);
                calcResult.textContent = Number.isFinite(val) ? String(Math.round(val * 1e9) / 1e9) : '—';
            } catch (err) {
                calcResult.textContent = '…';
            }
        });

        const PX_PER_UNIT = 40;

        function buildFunctionGraph(sizeStr, eqStr, color) {
            let sizeMatch = /^\s*([\d.]+)\s*[x×xX]\s*([\d.]+)\s*$/.exec(sizeStr);
            if (!sizeMatch) { alert('Формат размера: например 5x4'); return null; }
            let halfW = parseFloat(sizeMatch[1]);
            let halfH = parseFloat(sizeMatch[2]);
            if (!(halfW > 0) || !(halfH > 0)) { alert('Размер должен быть положительным числом'); return null; }

            let w = halfW * 2 * PX_PER_UNIT;
            let h = halfH * 2 * PX_PER_UNIT;

            let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            let bg = svgEl('rect', { x: -w / 2, y: -h / 2, width: w, height: h, fill: 'rgba(0,0,0,0.35)', stroke: 'rgba(255,255,255,0.15)' });
            g.appendChild(bg);

            for (let gx = Math.ceil(-halfW); gx <= Math.floor(halfW); gx++) {
                g.appendChild(svgEl('line', {
                    x1: gx * PX_PER_UNIT, y1: -h / 2, x2: gx * PX_PER_UNIT, y2: h / 2,
                    stroke: gx === 0 ? color : 'rgba(255,255,255,0.18)', 'stroke-width': gx === 0 ? 2 : 1
                }));
            }
            for (let gy = Math.ceil(-halfH); gy <= Math.floor(halfH); gy++) {
                g.appendChild(svgEl('line', {
                    x1: -w / 2, y1: gy * PX_PER_UNIT, x2: w / 2, y2: gy * PX_PER_UNIT,
                    stroke: gy === 0 ? color : 'rgba(255,255,255,0.18)', 'stroke-width': gy === 0 ? 2 : 1
                }));
            }

            let eqNoSpace = String(eqStr).replace(/\s+/g, '');
            let circleMatch = /^x\^2\+y\^2=(.+)$/i.exec(eqNoSpace);

            if (circleMatch) {
                let rSq;
                try { rSq = evalMathExpr(circleMatch[1]); } catch (err) { alert('Ошибка в уравнении: ' + err.message); return null; }
                let r = Math.sqrt(Math.abs(rSq));
                g.appendChild(svgEl('circle', { cx: 0, cy: 0, r: r * PX_PER_UNIT, fill: 'none', stroke: color, 'stroke-width': 2.5 }));
            } else {
                let rhs = eqNoSpace.replace(/^y=/i, '');
                let steps = 500;
                let d = '';
                let drawing = false;
                for (let s = 0; s <= steps; s++) {
                    let x = -halfW + (2 * halfW) * (s / steps);
                    let y;
                    try { y = evalMathExpr(rhs, { x: x }); } catch (err) { drawing = false; continue; }
                    if (!isFinite(y) || Math.abs(y) > halfH * 1.02) { drawing = false; continue; }
                    let px = (x * PX_PER_UNIT).toFixed(2);
                    let py = (-y * PX_PER_UNIT).toFixed(2);
                    d += (drawing ? ' L ' : ' M ') + px + ' ' + py;
                    drawing = true;
                }
                if (!d) { alert('false equation'); return null; }
                g.appendChild(svgEl('path', { d: d.trim(), fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linecap': 'round' }));
            }

            return g;
        }

        const graphPopup = document.getElementById('graph-popup');
        document.getElementById('graph-toggle-btn').addEventListener('click', () => {
            calcPopup.classList.remove('open');
            graphPopup.classList.toggle('open');
        });

        document.getElementById('graph-build-btn').addEventListener('click', () => {
            let sizeStr = document.getElementById('graph-size-input').value;
            let eqStr = document.getElementById('graph-eq-input').value;
            if (!sizeStr.trim() || !eqStr.trim()) { alert('fill both fields'); return; }
            let g = buildFunctionGraph(sizeStr, eqStr, state.shapeColor);
            if (g) {
                placeNewElement(g);
                graphPopup.classList.remove('open');
            }
        });

        (function () {
            const trigger = document.getElementById('top-hover-trigger');
            const bar1 = document.getElementById('top-container');
            const bar2 = document.getElementById('extended-toolbar');

            function refresh() {
                let show = trigger.matches(':hover') || bar1.matches(':hover') || bar2.matches(':hover');
                bar1.classList.toggle('active-menu', show);
                bar2.classList.toggle('active-menu', show);
            }
            [trigger, bar1, bar2].forEach(el => {
                el.addEventListener('mouseenter', refresh);
                el.addEventListener('mouseleave', refresh);
            });

            function syncWidth() { bar2.style.width = bar1.getBoundingClientRect().width + 'px'; }
            if (window.ResizeObserver) {
                new ResizeObserver(syncWidth).observe(bar1);
            } else {
                window.addEventListener('resize', syncWidth);
            }
            syncWidth();
        })();

        const serverBtn = document.getElementById('server-btn');
        const serverModal = document.getElementById('server-modal');
        const fmTree = document.getElementById('fm-tree');

        serverBtn.addEventListener('click', () => serverModal.classList.remove('hidden'));
        document.getElementById('close-modal-btn').addEventListener('click', () => serverModal.classList.add('hidden'));

        document.getElementById('connect-btn').addEventListener('click', async () => {
            let url = document.getElementById('server-url').value.replace(/\/$/, "");
            try {
                let res = await fetch(url + '/api/tree');
                if (!res.ok) throw new Error("Server response not OK");
                state.serverUrl = url;
                serverBtn.style.color = 'var(--accent)';
                serverModal.classList.add('hidden');
                
                sidebarPanel.classList.remove('collapsed');
                toggleExplorerBtn.classList.add('active');
                
                refreshTree();
            } catch (e) {
                alert("Connection error: " + e.message);
            }
        });

        async function apiCall(endpoint, method='GET', body=null) {
            if (!state.serverUrl) return null;
            let options = { method, headers: {} };
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            let res = await fetch(state.serverUrl + endpoint, options);
            if (!res.ok) {
                let err = await res.text();
                throw new Error(err);
            }
            let text = await res.text();
            try { return JSON.parse(text); } catch (e) { return text; }
        }

        async function refreshTree() {
            try {
                let tree = await apiCall('/api/tree');
                if (Array.isArray(tree)) {
                    fmTree.innerHTML = buildTreeHTML(tree);
                    bindTreeEvents();
                }
            } catch (e) {
                console.error("Failed to load tree", e);
            }
        }

        function buildTreeHTML(nodes) {
            let html = "";
            for (let node of nodes) {
                if (node.type === 'folder') {
                    html += `<details data-path="${node.path}">
                                <summary><svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> ${node.name}</summary>
                                <div class="folder-content">
                                    ${buildTreeHTML(node.children || [])}
                                </div>
                             </details>`;
                } else {
                    html += `<div class="file-item" data-path="${node.path}"><svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ${node.name}</div>`;
                }
            }
            return html;
        }

        function bindTreeEvents() {
            document.querySelectorAll('.file-item, summary').forEach(el => {
                el.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.file-item, summary').forEach(x => x.classList.remove('selected'));
                    el.classList.add('selected');
                    
                    let path = el.tagName === 'SUMMARY' ? el.parentElement.getAttribute('data-path') : el.getAttribute('data-path');
                    state.selectedNodePath = path;

                    if (el.classList.contains('file-item')) {
                        state.currentFilePath = path;
                        try {
                            let responseData = await apiCall('/api/file?path=' + encodeURIComponent(path));
                            let svgContent = "";
                            if (typeof responseData === 'object' && responseData !== null) {
                                svgContent = responseData.content || responseData.data || "";
                            } else {
                                svgContent = responseData;
                            }
                            
                            try {
                                let parsed = JSON.parse(svgContent);
                                if (parsed && parsed.content) svgContent = parsed.content;
                            } catch(err){}

                            let parser = new DOMParser();
                            let doc = parser.parseFromString(svgContent, "image/svg+xml");
                            let importedLayer = doc.getElementById('svg-layer') || doc.documentElement;
                            if (importedLayer) {
                                svgLayer.innerHTML = importedLayer.innerHTML;
                                saveHistory();
                            }
                        } catch (err) {
                            console.error("Load file error", err);
                        }
                    }
                });
            });
        }

        async function autoSave() {
            if (!state.serverUrl || !state.currentFilePath) return;
            const fullSvgString = new XMLSerializer().serializeToString(canvas);
            const payload = {
                path: state.currentFilePath,
                content: fullSvgString,
                data: fullSvgString
            };
            try {
                await apiCall('/api/file', 'POST', payload);
            } catch (e) { 
                console.error("Autosave failed", e); 
            }
        }

        document.getElementById('fm-new-file').addEventListener('click', async () => {
            let name = prompt("File name (with .svg):", "drawing.svg");
            if (!name) return;
            let path = getParentPath() + "/" + name;
            path = path.replace(/^\//, '');
            let initialSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><g id="svg-layer"></g></svg>`;
            try {
                await apiCall('/api/file', 'POST', { path: path, content: initialSvg, data: initialSvg });
                state.currentFilePath = path;
                svgLayer.innerHTML = '<g id="svg-layer"></g>';
                refreshTree();
            } catch(e) {
                alert("Error creating file: " + e.message);
            }
        });

        document.getElementById('fm-new-folder').addEventListener('click', async () => {
            let name = prompt("Folder name:");
            if (!name) return;
            let path = getParentPath() + "/" + name;
            path = path.replace(/^\//, '');
            try {
                await apiCall('/api/folder', 'POST', { path: path });
                refreshTree();
            } catch(e) {
                alert("Error creating folder: " + e.message);
            }
        });

        document.getElementById('fm-rename').addEventListener('click', async () => {
            if (!state.selectedNodePath) return alert("Select a file or folder to rename");
            let newName = prompt("New name:", state.selectedNodePath.split('/').pop());
            if (!newName) return;
            let dir = state.selectedNodePath.substring(0, state.selectedNodePath.lastIndexOf('/'));
            let newPath = (dir ? dir + "/" : "") + newName;
            try {
                await apiCall('/api/rename', 'PUT', { old: state.selectedNodePath, new: newPath });
                refreshTree();
            } catch(e) {
                alert("Error renaming: " + e.message);
            }
        });

        document.getElementById('fm-delete').addEventListener('click', async () => {
            if (!state.selectedNodePath) return alert("Select a file or folder to delete");
            if (confirm("Are you sure you want to delete " + state.selectedNodePath + "?")) {
                try {
                    await apiCall('/api/delete?path=' + encodeURIComponent(state.selectedNodePath), 'DELETE');
                    if (state.currentFilePath === state.selectedNodePath) {
                        state.currentFilePath = null;
                        svgLayer.innerHTML = "";
                    }
                    refreshTree();
                } catch(e) {
                    alert("Error deleting: " + e.message);
                }
            }
        });

        function getParentPath() {
            if (!state.selectedNodePath) return "";
            let el = `[data-path="${state.selectedNodePath}"]`;
            let found = document.querySelector(el);
            if (found && found.tagName === 'DETAILS') return state.selectedNodePath;
            return state.selectedNodePath.substring(0, state.selectedNodePath.lastIndexOf('/')) || "";
        }

        // init
        init();
    </script>
