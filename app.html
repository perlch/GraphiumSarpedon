
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>graphium sarpedon | 1.0.0</title>
    
    <!-- LaTeX for future stuff 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    -->
    <style>
    
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(8, 14, 24, 0.92);
            --panel-border: rgba(0, 210, 255, 0.35);
            --text-color: #e0f7ff;
            --accent: #00d2ff;
            --hover-bg: rgba(0, 210, 255, 0.15);
            
            --sidebar-bg: #04070d;
            --explorer-bg: #080e18;
            --slide-bg: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            touch-action: none; 
        }
        #app-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #activity-bar {
            width: 48px;
            min-width: 48px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            z-index: 200;
        }

        .activity-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: 1px solid transparent;
            color: #8ab4f8;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .activity-btn:hover {
            color: var(--accent);
            background: var(--hover-bg);
        }

        .activity-btn.active {
            color: #ffffff;
            border-color: var(--accent);
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .activity-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .activity-divider {
            width: 24px;
            height: 1px;
            background: var(--panel-border);
            margin: 8px 0 16px 0;
        }

        #sidebar-panel {
            width: 260px;
            min-width: 260px;
            background-color: var(--explorer-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 150;
        }

        #sidebar-panel.collapsed {
            margin-left: -260px;
        }

        .sidebar-header-title {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fm-toolbar {
            display: flex; gap: 5px; padding: 8px; border-bottom: 1px solid var(--panel-border); background: #04070d;
        }
        .fm-toolbar button { padding: 4px 8px; font-size: 12px; box-shadow: none; min-height: unset; }
        .fm-content {
            flex-grow: 1; overflow-y: auto; padding: 10px 5px; font-size: 13px;
        }
        details { padding-left: 10px; margin-top: 2px; }
        summary { cursor: pointer; padding: 4px; border-radius: 4px; list-style: none; display: flex; align-items: center; gap: 6px; }
        summary:hover, .file-item:hover { background: var(--hover-bg); }
        summary::before { content: '▶'; font-size: 9px; color: var(--accent); transition: transform 0.2s; }
        details[open] > summary::before { transform: rotate(90deg); }
        .file-item {
            cursor: pointer; padding: 4px 4px 4px 22px; border-radius: 4px; margin-top: 2px; display: flex; align-items: center; gap: 6px;
        }
        .file-item.selected { background: rgba(0, 210, 255, 0.3); color: #fff; }

        #main-content {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-color);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
            touch-action: none;
            display: block;
        }

        svg#canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: block;
        }

        .interactive {
            pointer-events: auto;
        }

        #top-hover-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            z-index: 9999;
            pointer-events: auto;
        }

        #top-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translate(-50%, -26px);
            opacity: 0.35;
            filter: blur(1px);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, filter 0.2s ease;
            z-index: 10000;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.2), inset 0 0 12px rgba(0, 210, 255, 0.08);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 95%;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 210, 255, 0.4) transparent;
        }

        #top-container::-webkit-scrollbar {
            height: 3px;
        }
        #top-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.5);
            border-radius: 3px;
        }

        #top-hover-trigger:hover + #top-container,
        #top-container:hover,
        #top-container.active-menu {
            transform: translate(-50%, 0);
            opacity: 1;
            filter: blur(0);
        }

        #extended-toolbar {
            position: absolute;
            top: 66px;
            left: 50%;
            transform: translate(-50%, -20px);
            opacity: 0.35;
            filter: blur(1px);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, filter 0.2s ease;
            z-index: 9998;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.2), inset 0 0 12px rgba(0, 210, 255, 0.08);
            border-radius: 12px;
            padding: 6px 12px;
            display: none;
            align-items: center;
            gap: 8px;
            max-width: 95%;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 210, 255, 0.4) transparent;
        }

        #extended-toolbar::-webkit-scrollbar { height: 3px; }
        #extended-toolbar::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.5); border-radius: 3px; }

        #extended-toolbar.visible { display: flex; }

        #extended-toolbar.visible.active-menu {
            transform: translate(-50%, 0);
            opacity: 1;
            filter: blur(0);
        }

        .ext-slider-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 6px;
            color: #8ab4f8;
        }

        .ext-slider-wrap input[type="range"] {
            width: 80px;
            accent-color: var(--accent);
            cursor: pointer;
            background: transparent;
        }

        .ext-popup {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            border-bottom: 2px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.25);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 230px;
            max-height: 0;
            opacity: 0;
            padding: 0 14px;
            overflow: hidden;
            pointer-events: none;
            z-index: 10001;
            transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, padding 0.32s ease;
        }

        .ext-popup.open {
            max-height: 220px;
            opacity: 1;
            padding: 14px;
            pointer-events: auto;
        }

        .ext-popup input[type="text"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            color: var(--text-color);
            padding: 8px 10px;
            font-size: 13px;
            width: 100%;
            min-height: unset;
        }

        .ext-popup input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        #calc-result {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            text-align: right;
            padding: 2px 4px;
            min-height: 28px;
        }

        .pm-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pm-btn {
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            min-width: 36px;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .pm-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.25);
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            flex-shrink: 0;
        }

        button, input[type="color"] {
            background: transparent;
            border: 1px solid transparent;
            color: #8ab4f8;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            min-height: 34px;
            min-width: 34px;
            flex-shrink: 0;
        }

        button:hover {
            background: var(--hover-bg);
            border-color: rgba(0, 210, 255, 0.4);
            color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.25);
        }

        button.active {
            background: rgba(0, 210, 255, 0.25);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.45);
        }

        button svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #server-btn {
            font-size: 16px;
            width: 38px;
            height: 38px;
            border: 1px solid var(--panel-border);
            background: rgba(0, 210, 255, 0.1);
        }

        .color-slot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            position: relative;
            flex-shrink: 0;
        }

        .color-slot:hover {
            transform: scale(1.15);
        }

        .color-slot.active {
            border-color: #fff;
            box-shadow: 0 0 10px currentColor;
        }

        #color-picker-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            padding: 0;
        }

        .hidden { display: none !important; }

        .modal-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; z-index: 1000;
        }
        .modal {
            background: #080e18;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.2);
        }
        .modal input {
            background: #000; border: 1px solid var(--panel-border); color: #fff; padding: 10px; border-radius: 6px; outline: none;
        }

        .tools-divider { width: 1px; height: 22px; background: var(--panel-border); margin: 0 4px; flex-shrink: 0; }

        .selection-overlay {
            fill: none;
            stroke: var(--accent);
            stroke-width: 1.5;
            stroke-dasharray: 4;
            pointer-events: none;
            vector-effect: non-scaling-stroke; 
        }

        .transform-handle {
            fill: var(--accent);
            stroke: #ffffff;
            stroke-width: 1.5;
            cursor: nwse-resize;
            transition: r 0.1s ease;
            vector-effect: non-scaling-stroke;
        }

        .transform-handle:hover {
            fill: #ffffff;
            stroke: var(--accent);
        }
        
        .lasso-polygon {
            fill: rgba(0, 210, 255, 0.15);
            stroke: var(--accent);
            stroke-dasharray: 5, 5;
            stroke-width: 1.5;
            pointer-events: none;
            vector-effect: non-scaling-stroke;
        }

        #lasso-action-bar {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid var(--accent);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 4px 8px;
            display: flex;
            gap: 6px;
            z-index: 10000;
            box-shadow: 0 4px 16px rgba(0, 210, 255, 0.3);
            pointer-events: auto;
        }

        #text-editor-palette {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 420px;
            background: var(--explorer-bg);
            border: 1px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.15);
            display: none;
            flex-direction: column;
            z-index: 10005;
            pointer-events: auto;
            resize: both;
            overflow: hidden;
            min-width: 300px;
            min-height: 250px;
        }

        .palette-header {
            background: var(--sidebar-bg);
            padding: 8px 12px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            font-size: 12px;
            font-weight: bold;
            color: var(--accent);
        }

        .palette-header-controls {
            display: flex;
            gap: 4px;
        }

        .palette-header-btn {
            background: transparent;
            border: none;
            color: #8ab4f8;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .palette-header-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }

        .palette-toolbar {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #04070d;
            border-bottom: 1px solid var(--panel-border);
            align-items: center;
            flex-wrap: wrap;
        }

        #text-palette-textarea {
            flex-grow: 1;
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            resize: none;
            outline: none;
        }

        .palette-footer {
            padding: 8px;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .latex-keyboard-container {
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: #080e18;
            border-bottom: 1px solid var(--panel-border);
        }
    </style>
</head>
<body>

    <div id="app-layout">
        <div id="activity-bar">
            <button class="activity-btn active" id="mode-canvas" title="Canvas Mode">
                <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
            </button>
            <button class="activity-btn" id="toggle-extended-toolbar" title="Extended Tools">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            
            <div class="activity-divider"></div>
            
            <button class="activity-btn active" id="toggle-explorer" title="Toggle Explorer">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </button>
        </div>

        <div id="sidebar-panel">
            <div class="sidebar-header-title">
                <span>Explorer</span>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <button id="fm-hide-sidebar" class="btn" style="padding: 2px; min-width: 22px; min-height: 22px;" title="Hide Explorer">
                        <svg viewBox="0 0 24 24" style="width:12px; height:12px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div class="fm-toolbar">
                <button class="btn" id="fm-new-file" title="New File">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                </button>
                <button class="btn" id="fm-new-folder" title="New Folder">
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                </button>
                <button class="btn" id="fm-rename" title="Rename">
                    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="btn" id="fm-delete" title="Delete">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
            <div class="fm-content" id="fm-tree"></div>
        </div>

        <div id="main-content">
            
            <div id="canvas-container">
                <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
                     <g id="viewport">
                        <g id="svg-layer"></g>
                        <g id="ui-overlay"></g>
                    </g>
                </svg>
            </div>

            <div id="ui-layer">
                <div id="top-hover-trigger"></div>
                <div id="top-container" class="interactive">
                    <button id="server-btn" class="btn" title="Server Connection">
                        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                    </button>
                    
                    <div class="tools-divider"></div>

                    <div class="menu-group">
                        <button class="btn tool-btn active" data-tool="brush" title="Brush">
                            <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
                        </button>
                        <button class="btn tool-btn" data-tool="line" title="Line">
                            <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
                        </button>
                        <button class="btn tool-btn" data-tool="eraser" title="Eraser">
                            <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L21 6C22 7 22 9 21 10L12 19"/><line x1="18" y1="12" x2="11" y2="5"/></svg>
                        </button>
                        <button class="btn tool-btn" data-tool="fill" title="Fill">
                            <svg viewBox="0 0 24 24"><path d="M19 11l-8-8-8 8.5a2 2 0 0 0 0 2.83l6.17 6.17a2 2 0 0 0 2.83 0L19 11z"/></svg>
                        </button>
                        <!-- text tool, also in future for LaTeX
                        <button class="btn tool-btn" data-tool="text" title="Text Palette (Graphium Editor)">
                            <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                        </button>
                         -->
                    </div>
                    
                    <div class="tools-divider"></div>
                    
                    <div class="menu-group">
                        <div class="color-slot active" id="slot-1" style="background: #00d2ff; color: #00d2ff;" title="Primary Color"></div>
                        <div class="color-slot" id="slot-2" style="background: #ff0055; color: #ff0055;" title="Secondary Color"></div>
                        <div class="color-slot" id="slot-3" style="background: linear-gradient(135deg, #f00, #0f0, #00f);" title="Pick Color...">
                            <input type="color" id="color-picker-input" value="#00d2ff">
                        </div>
                        <button class="btn tool-btn" data-tool="picker" title="Eyedropper">
